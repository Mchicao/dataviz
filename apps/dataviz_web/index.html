<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataVIZ · Demo Tableau reproducida</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f7fa; color: #172536; --dv-axis-text: #607184; --dv-grid: #d7e0e8; --dv-ink: #123b63; --dv-accent: #1677b8; --duration-fast: 120ms; --ease-out-smooth: cubic-bezier(0.22, 1, 0.36, 1); }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 0; background: #f4f7fa; }
      #root { min-height: 100vh; padding: 24px clamp(16px, 4vw, 56px) 64px; }
      .dv-runtime { max-width: 1480px; margin: 0 auto; }
      .dv-report-status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 0 14px; padding: 8px 0; border-bottom: 1px solid #d4dfe8; color: #5d7082; font-size: 12px; }
      .dv-report-status strong { margin-right: auto; color: var(--dv-ink); font-size: 13px; }
      .dv-page { margin-bottom: 40px; }
      .dv-page-nav { display: flex; gap: 8px; margin: 0 0 20px; overflow-x: auto; padding: 2px 0 6px; }
      .dv-page-nav button, .dv-clear-filters { border: 1px solid #bdcbd7; border-radius: 8px; background: #fff; color: #29425b; cursor: pointer; padding: 8px 12px; font: inherit; font-size: 13px; white-space: nowrap; transition: background-color var(--duration-fast) var(--ease-out-smooth), border-color var(--duration-fast) var(--ease-out-smooth), color var(--duration-fast) var(--ease-out-smooth); }
      .dv-page-nav button:hover, .dv-clear-filters:not(:disabled):hover { border-color: #1677b8; color: #0d5f96; }
      .dv-page-nav button:focus-visible, .dv-clear-filters:focus-visible { outline: 3px solid #0b76c4; outline-offset: 2px; }
      .dv-page-nav button[aria-current="page"] { background: var(--dv-ink); border-color: var(--dv-ink); color: white; }
      .dv-clear-filters { margin-bottom: 18px; }
      .dv-clear-filters:disabled { cursor: default; color: #8a9aaa; background: #edf2f6; }
      .dv-page h1 { color: var(--dv-ink); font-size: 28px; line-height: 1.15; margin: 0 0 18px; letter-spacing: -0.02em; }
      .dv-canvas-viewport { max-width: 100%; overflow: visible; }
      .dv-canvas { align-items: stretch; background: #e8eef3; border: 1px solid #d4dfe8; border-radius: 16px; padding: 16px; }
      .dv-canvas--geometry { overflow: hidden; padding: 0; }
      .dv-visual { min-width: 0; min-height: 0; overflow: hidden; background: #fff; border: 1px solid #d6e0e8; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(20, 48, 75, 0.06); }
      .dv-visual--compact { height: 180px; align-self: start; background: #fafdff; }
      .dv-visual h2, .dv-visual h3 { color: var(--dv-ink); margin: 0 0 8px; font-size: 14px; }
      .dv-density-note { flex: 0 0 auto; color: #61778a; font-size: 9px; font-weight: 500; }
      .dv-runtime-loading, .dv-runtime-error, .dv-runtime-empty { padding: 32px; text-align: center; }
      .dv-runtime-error { color: #991b1b; }
      .dv-filter-error { color: #9c2f2f; }
      .dv-slicer { display: flex; min-width: 0; height: 100%; align-items: center; gap: 8px; color: #314960; font-size: 12px; padding: 5px 8px; }
      .dv-slicer > span { flex: 0 0 auto; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dv-slicer select, .dv-slicer input { min-width: 0; width: min(210px, 100%); height: 30px; border: 1px solid #b8c7d4; border-radius: 6px; background: #fff; color: #19354e; padding: 4px 8px; font: inherit; }
      .dv-slicer select:focus-visible, .dv-slicer input:focus-visible { outline: 3px solid #0b76c4; outline-offset: 1px; border-color: #1677b8; }
      .dv-slicer select:disabled, .dv-slicer input:disabled { background: #edf2f6; color: #718293; cursor: not-allowed; }
      .dv-visual--hierarchy-navigator { padding: 0; }
      .dv-hierarchy-navigator { display: flex; height: 100%; min-height: 0; flex-direction: column; background: #fff; color: #25394d; }
      .dv-hierarchy-navigator header { flex: 0 0 auto; border-bottom: 1px solid #d6e0e8; padding: 10px 12px 8px; color: #243f59; font-size: 13px; }
      .dv-hierarchy-navigator > input { flex: 0 0 auto; margin: 8px 10px; border: 1px solid #b8c7d4; border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 12px; }
      .dv-hierarchy-tree, .dv-hierarchy-tree ul { margin: 0; padding: 0; list-style: none; }
      .dv-hierarchy-tree { min-height: 0; flex: 1 1 auto; overflow: auto; padding: 2px 4px 10px; font-size: 12px; }
      .dv-hierarchy-node { display: flex; min-width: 0; align-items: center; gap: 2px; min-height: 24px; }
      .dv-hierarchy-toggle, .dv-hierarchy-label { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      .dv-hierarchy-toggle { width: 22px; height: 22px; flex: 0 0 22px; padding: 0; color: #5d7184; font-size: 15px; }
      .dv-hierarchy-spacer { width: 22px; flex: 0 0 22px; }
      .dv-hierarchy-label { min-width: 0; flex: 1 1 auto; overflow: hidden; border-radius: 3px; padding: 4px 6px; text-align: left; text-overflow: ellipsis; white-space: nowrap; transition: background-color var(--duration-fast) var(--ease-out-smooth), color var(--duration-fast) var(--ease-out-smooth); }
      .dv-hierarchy-label:hover { background: #eef4f8; }
      .dv-hierarchy-label[aria-current="true"] { background: #dcebf5; color: #0d5f96; font-weight: 600; }
      .dv-hierarchy-toggle:focus-visible, .dv-hierarchy-label:focus-visible, .dv-hierarchy-navigator > input:focus-visible { outline: 2px solid #0b76c4; outline-offset: 1px; }
      svg { display: block; max-width: 100%; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td, th { border-bottom: 1px solid #d7e0e8; padding: 7px 5px; text-align: left; }
      .dv-table-row--selected { background: #dcebf5; color: #0d5f96; }
      .dv-treemap { display: flex !important; flex-direction: column; gap: 10px; }
      .dv-treemap__caption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--dv-ink); font-weight: 700; }
      .dv-treemap__summary { color: #6c7f90; font-size: 11px; font-weight: 500; white-space: nowrap; }
      .dv-treemap__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(54px, 1fr); gap: 4px; flex: 1; min-height: 0; overflow: hidden; }
      .dv-treemap__tile { display: flex; min-width: 0; flex-direction: column; justify-content: space-between; gap: 4px; border-radius: 6px; padding: 8px; color: #fff; overflow: hidden; }
      .dv-treemap__tile--lead { grid-column: span 2; grid-row: span 2; padding: 12px; }
      .dv-treemap__tile strong, .dv-treemap__tile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dv-treemap__tile strong { font-size: 12px; }
      .dv-treemap__tile span { font-size: 11px; opacity: .9; }
      .dv-visual--compact .dv-treemap__grid { grid-auto-rows: minmax(24px, 1fr); }
      .dv-visual--compact .dv-treemap__tile { padding: 5px; }
      .dv-visual--compact .dv-treemap__tile strong { font-size: 9px; }
      .dv-visual--compact .dv-treemap__tile span { font-size: 8px; }
      @media (max-width: 900px) {
        #root { padding-inline: 12px; }
        .dv-canvas { grid-template-columns: 1fr; padding: 12px; }
        .dv-visual--hero, .dv-visual--support, .dv-visual--compact { grid-column: 1 / -1 !important; grid-row: auto !important; min-height: 220px; height: auto; }
        .dv-canvas--geometry .dv-visual { min-height: 0; }
      }
      @media (min-width: 901px) and (max-width: 1120px) {
        .dv-visual--hero { grid-column: 4 / -1; }
        .dv-visual--support { grid-column: 1 / 4; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dv-runtime *, .dv-runtime *::before, .dv-runtime *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dataviz_web/package-lock.json

      - name: Build landing
        run: |
          npm ci
          npx vite build --config vite.pages.config.ts
          cp dist-pages/pages.html dist-pages/index.html
        working-directory: apps/dataviz_web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dataviz_web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
